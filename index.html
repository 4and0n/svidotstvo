<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Свідоцтв — Ансамбль Веселка</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Great+Vibes&family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; font-family: 'Lora', Georgia, serif; }
        .navy-text { color: #1a2a4a; }
        .gold-text { color: #C8A84B; }
        
        @media print {
            body { background: none !important; background-color: #fdf8f0 !important; }
            .no-print { display: none !important; }
            @page { size: 297mm 210mm; margin: 0; }
            .a4-sheet {
                width: 297mm !important;
                height: 210mm !important;
                page-break-after: always !important;
                page-break-inside: avoid !important;
                position: relative !important;
                display: block !important;
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .fold-crease { display: none !important; }
            .print-visible { display: block !important; }
        }

        @media screen {
            .a4-sheet {
                width: 297mm;
                height: 210mm;
                position: relative;
                background-color: #fdf8f0;
                box-shadow: 0 12px 48px rgba(0,0,0,0.7);
                overflow: hidden;
            }
            .screen-hidden { display: none !important; }
        }

        .half-sheet { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; box-sizing: border-box; margin: 0; padding: 0; }
    </style>
</head>
<body class="text-gray-100 antialiased min-h-screen pb-12">

    <!-- ── ПАНЕЛЬ КЕРУВАННЯ (Скрыта при печати) ── -->
    <div class="no-print max-w-4xl mx-auto mt-6 p-5 bg-gray-900 rounded-xl border border-gray-800 shadow-2xl">
        <h2 class="text-lg font-bold mb-4 text-amber-400 font-sans tracking-wide text-center">Панель автоматизації свідоцтв «ВЕСЕЛКА»</h2>
        
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-1/2">
                <label class="block text-xs font-medium text-gray-400 mb-1">Введіть ПІБ отримувача:</label>
                <input type="text" id="nameInputField" value="Іванову Івану Івановичу" 
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white font-serif text-base focus:ring-2 focus:ring-amber-500 focus:outline-none transition-all">
            </div>

            <!-- Переключатель в стиле вашего ИИ-интерфейса -->
            <div class="flex bg-black p-1 rounded-lg border border-gray-800">
                <button id="btnOuter" onclick="switchTab('outer')" class="px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-md transition-all bg-amber-500 text-gray-950">
                    Аркуш 1 · Зовнішній
                </button>
                <button id="btnInner" onclick="switchTab('inner')" class="px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-md transition-all text-gray-400 hover:text-white">
                    Аркуш 2 · Внутрішній
                </button>
            </div>
            
            <button onclick="window.print()" 
                    class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-gray-950 font-bold py-3 px-6 rounded-lg font-sans text-xs uppercase tracking-wider shadow-lg">
                Скачати готовий PDF
            </button>
        </div>
    </div>

    <!-- ── ОБЛАСТЬ МАКЕТА ── -->
    <div class="flex flex-col gap-8 items-center mt-6">

        <!-- ========================================== -->
        <!-- ═══ АРКУШ 1 · ЗОВНІШНІЙ РОЗВОРОТ ═══ -->
        <!-- ========================================== -->
        <div id="sheetOuter" class="a4-sheet">
            <div class="fold-crease" style="position:absolute; top:0; bottom:0; left:50%; width:1px; background:linear-gradient(to bottom,transparent,rgba(0,0,0,0.15) 20%,rgba(0,0,0,0.2) 50%,rgba(0,0,0,0.15) 80%,transparent); z-index:20; transform:translateX(-50%);"></div>
            <div class="half-sheet" style="left:0; background-color:#fdf8f0;"></div>
            <div class="half-sheet" style="left:50%; display:flex; align-items:center; justify-content:center;">
                
                <!-- Рамка А5 -->
                <div style="position:absolute; inset:0; padding:12px;" class="outer-frame-container"></div>
                
                <div style="position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:14px; padding:0 10%; width:100%; text-align:center;">
                    <svg width="75px" viewBox="0 0 120 32">
                        <line x1="0" y1="16" x2="42" y2="16" stroke="#C8A84B" stroke-width="1.5"/>
                        <polygon points="48,6 54,16 48,26 42,16" fill="none" stroke="#C8A84B" stroke-width="1.2"/>
                        <polygon points="60,9 66,16 60,23 54,16" fill="#C8A84B"/>
                        <polygon points="72,6 78,16 72,26 66,16" fill="none" stroke="#C8A84B" stroke-width="1.2"/>
                        <line x1="78" y1="16" x2="120" y2="16" stroke="#C8A84B" stroke-width="1.5"/>
                    </svg>
                    <p style="font-size:8.5px; color:#1a2a4a; letter-spacing:0.15em; text-transform:uppercase; margin:0; font-family:'IM Fell English',Georgia,serif; opacity:0.75;">
                        Національна Хореографічна спілка України
                    </p>
                    <h1 style="font-family:'Great Vibes',cursive; font-size:52px; color:#1a2a4a; margin:0; line-height:1.1;">
                        Свідоцтво
                    </h1>
                    <svg width="65px" viewBox="0 0 110 12" style="opacity:0.7">
                        <line x1="0" y1="6" x2="44" y2="6" stroke="#C8A84B" stroke-width="1"/>
                        <circle cx="55" cy="6" r="3.5" fill="#C8A84B"/>
                        <line x1="66" y1="6" x2="110" y2="6" stroke="#C8A84B" stroke-width="1"/>
                    </svg>
                    <p style="font-size:7px; color:#1a2a4a; letter-spacing:0.18em; text-transform:uppercase; margin:0; opacity:0.6; font-family:sans-serif;">
                        про проходження повного курсу навчання
                    </p>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- ═══ АРКУШ 2 · ВНУТРІШНІЙ РОЗВОРОТ ═══ -->
        <!-- ========================================== -->
        <div id="sheetInner" class="a4-sheet class-inner-sheet screen-hidden print-visible">
            <div class="fold-crease" style="position:absolute; top:0; bottom:0; left:50%; width:1px; background:linear-gradient(to bottom,transparent,rgba(0,0,0,0.15) 20%,rgba(0,0,0,0.2) 50%,rgba(0,0,0,0.15) 80%,transparent); z-index:20; transform:translateX(-50%);"></div>
            
            <!-- ЛЕВАЯ СТОРОНА — Векторные Танцоры под Радугой -->
            <div class="half-sheet" style="left:0; display:flex; align-items:center; justify-content:center;">
                <div style="position:absolute; inset:0; padding:12px;" class="outer-frame-container"></div>
                <div style="position:relative; z-index:2; width:58%; height:78%; display:flex; align-items:center; justify-content:center;">
                    
                    <!-- Художественный векторный контур танцующей пары (вместо потерянной картинки) -->
                    <svg viewBox="0 0 200 260" style="width:100%; height:100%;">
                        <path d="M20 230 Q100 20 180 230" fill="none" stroke="url(#rainbow)" stroke-width="14" opacity="0.45"/>
                        <defs>
                            <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#e63946"/><stop offset="30%" stop-color="#f9c74f"/>
                                <stop offset="60%" stop-color="#52b788"/><stop offset="100%" stop-color="#4361ee"/>
                            </linearGradient>
                        </defs>
                        <!-- Изящный силуэт хореографии -->
                        <path d="M90 120 C95 105 105 105 110 120 C105 135 115 150 125 165 C115 170 105 185 100 210 C95 185 85 170 75 165 C85 150 95 135 90 120 Z" fill="#1a2a4a" opacity="0.85"/>
                        <path d="M100 95 C105 95 105 105 100 105 C95 105 95 95 100 95 Z" fill="#C8A84B"/>
                        <path d="M70 130 Q100 115 120 140" fill="none" stroke="#C8A84B" stroke-width="2" stroke-dasharray="3,3"/>
                    </svg>

                    <!-- Тонкая фоторамка ИИ -->
                    <svg viewBox="0 0 300 420" style="position:absolute; inset:-8px; width:calc(100% + 16px); height:calc(100% + 16px); pointer-events:none; overflow:visible;">
                        <rect x="4" y="4" width="292" height="412" fill="none" stroke="#C8A84B" stroke-width="2"/>
                        <g transform="translate(4,4)"><line x1="0" y1="0" x2="18" y2="0" stroke="#C8A84B" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="18" stroke="#C8A84B" stroke-width="2"/></g>
                        <g transform="translate(296,4) rotate(90)"><line x1="0" y1="0" x2="18" y2="0" stroke="#C8A84B" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="18" stroke="#C8A84B" stroke-width="2"/></g>
